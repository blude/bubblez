openapi: 3.0.3
info:
  title: University Social Network API
  description: API for decentralized university social networking platform
  version: 1.0.0
  contact:
    name: Bubblez Development Team
  license:
    name: MIT

servers:
  - url: https://api.university.social/v1
    description: Production server
  - url: https://staging-api.university.social/v1
    description: Staging server

paths:
  /users:
    get:
      summary: Get current user profile
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '404':
          description: User not found

    post:
      summary: Create new user
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
        '409':
          description: User already exists

  /users/{userId}:
    get:
      summary: Get user by ID
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

  /droplets:
    get:
      summary: Get user's feed
      tags:
        - Droplets
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: bubbles
          in: query
          schema:
            type: array
            items:
              type: string
          description: Filter by bubble IDs
      responses:
        '200':
          description: Feed retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  droplets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Droplet'
                  hasMore:
                    type: boolean

    post:
      summary: Create new droplet
      tags:
        - Droplets
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDropletRequest'
      responses:
        '201':
          description: Droplet created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Droplet'
        '400':
          description: Invalid input
        '429':
          description: Rate limit exceeded

  /droplets/{dropletId}:
    get:
      summary: Get droplet by ID
      tags:
        - Droplets
      parameters:
        - name: dropletId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Droplet retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Droplet'
        '404':
          description: Droplet not found

    delete:
      summary: Delete droplet
      tags:
        - Droplets
      security:
        - BearerAuth: []
      parameters:
        - name: dropletId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Droplet deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Droplet not found

  /droplets/{dropletId}/interact:
    post:
      summary: Interact with droplet (vote, bookmark, etc.)
      tags:
        - Droplets
      security:
        - BearerAuth: []
      parameters:
        - name: dropletId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InteractionRequest'
      responses:
        '200':
          description: Interaction recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionMetrics'
        '400':
          description: Invalid interaction
        '401':
          description: Unauthorized

  /bubbles:
    get:
      summary: Get bubbles
      tags:
        - Bubbles
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: university
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Bubbles retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bubble'

    post:
      summary: Create new bubble
      tags:
        - Bubbles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBubbleRequest'
      responses:
        '201':
          description: Bubble created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bubble'

  /bubbles/{bubbleId}/join:
    post:
      summary: Join bubble
      tags:
        - Bubbles
      security:
        - BearerAuth: []
      parameters:
        - name: bubbleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Joined bubble successfully
        '401':
          description: Unauthorized
        '404':
          description: Bubble not found

  /bubbles/{bubbleId}/leave:
    post:
      summary: Leave bubble
      tags:
        - Bubbles
      security:
        - BearerAuth: []
      parameters:
        - name: bubbleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Left bubble successfully
        '401':
          description: Unauthorized

  /hotseat/games:
    get:
      summary: Get hotseat games
      tags:
        - Hotseat
      responses:
        '200':
          description: Games retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HotseatGame'

    post:
      summary: Create new hotseat game
      tags:
        - Hotseat
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '201':
          description: Game created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotseatGame'

  /hotseat/games/{gameId}/join:
    post:
      summary: Join hotseat game
      tags:
        - Hotseat
      security:
        - BearerAuth: []
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Joined game successfully
        '400':
          description: Cannot join game
        '404':
          description: Game not found

  /university/systems:
    get:
      summary: Get university system integrations
      tags:
        - University
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Systems retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UniversitySystem'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          format: uri
        role:
          $ref: '#/components/schemas/UserRole'
        universityId:
          type: string
        department:
          type: string
        yearOfStudy:
          type: integer
        joinedBubbles:
          type: array
          items:
            type: string
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        isActive:
          type: boolean

    UserRole:
      type: string
      enum:
        - student
        - professor
        - staff

    UserPreferences:
      type: object
      properties:
        emailNotifications:
          type: boolean
        pushNotifications:
          type: boolean
        hotseatOptIn:
          type: boolean
        dataSharing:
          $ref: '#/components/schemas/DataSharingLevel'

    DataSharingLevel:
      type: string
      enum:
        - private
        - university
        - federated

    Droplet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        content:
          type: string
        mediaAttachments:
          type: array
          items:
            $ref: '#/components/schemas/MediaAttachment'
        bubbles:
          type: array
          items:
            type: string
        mentions:
          type: array
          items:
            type: string
        replyToId:
          type: string
          format: uuid
        interactions:
          $ref: '#/components/schemas/InteractionMetrics'
        universityData:
          $ref: '#/components/schemas/UniversityData'
        visibility:
          $ref: '#/components/schemas/VisibilityLevel'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaAttachment:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/MediaType'
        url:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        size:
          type: integer
        mimeType:
          type: string

    MediaType:
      type: string
      enum:
        - image
        - video
        - document
        - audio

    InteractionMetrics:
      type: object
      properties:
        upvotes:
          type: integer
        downvotes:
          type: integer
        comments:
          type: integer
        shares:
          type: integer
        bookmarks:
          type: integer
        badges:
          type: array
          items:
            $ref: '#/components/schemas/Badge'

    Badge:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/BadgeType'
        awardedBy:
          type: string
          format: uuid
        reason:
          type: string
        awardedAt:
          type: string
          format: date-time

    BadgeType:
      type: string
      enum:
        - helpful
        - insightful
        - creative
        - collaborative

    VisibilityLevel:
      type: string
      enum:
        - public
        - university
        - bubble
        - private

    Bubble:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        hashtag:
          type: string
        description:
          type: string
        creatorId:
          type: string
          format: uuid
        memberCount:
          type: integer
        dropletCount:
          type: integer
        isPublic:
          type: boolean
        universityId:
          type: string
        moderators:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    HotseatGame:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/GameStatus'
        createdBy:
          type: string
          format: uuid
        maxParticipants:
          type: integer
        currentParticipants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        roundDuration:
          type: integer
        currentRound:
          type: integer
        totalRounds:
          type: integer
        settings:
          $ref: '#/components/schemas/GameSettings'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time

    GameStatus:
      type: string
      enum:
        - waiting
        - active
        - paused
        - completed

    Participant:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        joinedAt:
          type: string
          format: date-time
        currentGroup:
          type: string
        totalScore:
          type: integer

    GameSettings:
      type: object
      properties:
        autoAssignGroups:
          type: boolean
        groupSize:
          type: integer
        shuffleEachRound:
          type: boolean
        scoringRules:
          type: array
          items:
            $ref: '#/components/schemas/ScoringRule'

    ScoringRule:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/GameAction'
        points:
          type: integer

    GameAction:
      type: string
      enum:
        - post_droplet
        - comment
        - upvote
        - join_discussion

    UniversitySystem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/SystemType'
        config:
          $ref: '#/components/schemas/SystemConfig'
        status:
          $ref: '#/components/schemas/SystemStatus'
        lastSyncAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    SystemType:
      type: string
      enum:
        - e_learning
        - student_portal
        - intranet
        - public_portal
        - student_information_system

    SystemStatus:
      type: string
      enum:
        - active
        - inactive
        - error
        - syncing

    UniversityData:
      type: object
      properties:
        source:
          type: string
        type:
          $ref: '#/components/schemas/DataType'
        content:
          type: object
        syncAt:
          type: string
          format: date-time

    DataType:
      type: string
      enum:
        - course_announcement
        - university_event
        - assignment
        - deadline
        - support_group

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - displayName
        - role
        - universityId
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        universityId:
          type: string
        department:
          type: string
        yearOfStudy:
          type: integer
        preferences:
          $ref: '#/components/schemas/UserPreferences'

    CreateDropletRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          maxLength: 5000
        bubbles:
          type: array
          items:
            type: string
          maxItems: 5
        replyToId:
          type: string
          format: uuid
        visibility:
          $ref: '#/components/schemas/VisibilityLevel'
        mediaFiles:
          type: array
          items:
            type: string
            format: base64

    CreateBubbleRequest:
      type: object
      required:
        - name
        - hashtag
      properties:
        name:
          type: string
        hashtag:
          type: string
        description:
          type: string
        isPublic:
          type: boolean
          default: true
        tags:
          type: array
          items:
            type: string

    CreateGameRequest:
      type: object
      required:
        - name
        - maxParticipants
        - roundDuration
        - totalRounds
      properties:
        name:
          type: string
        description:
          type: string
        maxParticipants:
          type: integer
          minimum: 3
          maximum: 50
        roundDuration:
          type: integer
          minimum: 5
          maximum: 60
        totalRounds:
          type: integer
          minimum: 1
          maximum: 10
        settings:
          $ref: '#/components/schemas/GameSettings'

    InteractionRequest:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/InteractionType'
        badgeType:
          $ref: '#/components/schemas/BadgeType'
        reason:
          type: string

    InteractionType:
      type: string
      enum:
        - upvote
        - downvote
        - bookmark
        - share
        - badge

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Users
    description: User management operations
  - name: Droplets
    description: Content creation and interaction
  - name: Bubbles
    description: Topic/hashtag management
  - name: Hotseat
    description: Hotseat game functionality
  - name: University
    description: University system integration